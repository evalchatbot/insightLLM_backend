name: CI

on:
  push:
    branches: [dev, deployment, develop]
  pull_request:
    branches: [dev, deployment, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONIOENCODING: utf-8
  # Everything else the tests need (fake Supabase URL, dummy JWT secret, scheduler off,
  # no API keys) is set in backend/tests/conftest.py so local runs match CI exactly.

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install ruff
        run: python -m pip install "$(grep '^ruff==' requirements-dev.txt)"

      - name: Ruff (real errors only, see ruff.toml)
        run: ruff check --output-format=github .

      - name: Byte-compile backend
        run: python -m compileall -q backend

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: >
          python -m pytest -m "not integration"
          --cov=backend --cov-report=term --cov-report=xml:reports/coverage.xml
          --cov-fail-under=34
          --junitxml=reports/junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Job summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          import xml.etree.ElementTree as ET

          print("## Backend tests")
          if os.path.exists("reports/junit.xml"):
              suite = ET.parse("reports/junit.xml").getroot()
              suite = suite if suite.tag == "testsuite" else suite.find("testsuite")
              total, failures, errors, skipped = (int(suite.get(k, 0)) for k in ("tests", "failures", "errors", "skipped"))
              status = "PASSED" if failures == errors == 0 else "FAILED"
              print(f"**{status}** - {total - failures - errors - skipped} passed, {failures} failed, "
                    f"{errors} errors, {skipped} skipped/xfailed (of {total})")
          else:
              print("No JUnit report produced (tests did not run).")
          if os.path.exists("reports/coverage.xml"):
              rate = float(ET.parse("reports/coverage.xml").getroot().get("line-rate", 0))
              print(f"\nLine coverage of `backend/`: **{rate * 100:.1f}%**")
          PY

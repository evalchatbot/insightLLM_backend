# Test configuration for the FastAPI backend.
#
# Kept in pytest.ini (not pyproject.toml) on purpose: a pyproject.toml at the repo
# root can change how Railway/Nixpacks decides to build the service.
#
# CI command (see .github/workflows/ci.yml):
#   python -m pytest -m "not integration" --cov=backend --cov-report=xml:reports/coverage.xml \
#       --junitxml=reports/junit.xml
[pytest]
minversion = 9.0
# Root-level scripts (test_spell_integration.py, verify_ocr_import.py, ...) are manual
# tools, not tests: only collect from backend/tests.
testpaths = backend/tests
# "." makes `import backend.*` work; backend/tests exposes the shared `support` helpers.
pythonpath = . backend/tests
# importlib mode: test modules live in plain dirs (no __init__.py) under a namespace
# package, so avoid sys.path/basename collisions.
#
# --allow-hosts: pytest-socket blocks every socket connect() except loopback (the
# event loop's self-pipe and TestClient need 127.0.0.1). conftest.py additionally
# blocks DNS for non-local names, so a test that leaks a real HTTP call fails fast.
addopts =
    -ra
    --strict-markers
    --strict-config
    --import-mode=importlib
    --allow-hosts=127.0.0.1,::1
markers =
    unit: fast pure-logic tests (no HTTP client; files only under tmp_path)
    api: HTTP contract tests through FastAPI's TestClient with services mocked
    pdf: tests that build, render or inspect real PDFs with PyMuPDF
    integration: needs live services / API keys; skipped unless RUN_INTEGRATION=1
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
# Hard stop for a hung test (e.g. a background job that never finishes).
timeout = 120
filterwarnings =
    # Third-party / legacy-app deprecations that are not actionable from tests.
    ignore::DeprecationWarning:langchain.*
    ignore::DeprecationWarning:pydantic.*
    ignore::pydantic.warnings.PydanticDeprecatedSince20
    ignore:datetime.datetime.utcnow:DeprecationWarning
    ignore:.*on_event is deprecated.*:DeprecationWarning
